<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nuevo Reporte | Reporte Daños</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">🔧 Reporte Daños</a>
    <div class="navbar-links">
        <a th:href="@{/reportes}">Reportes</a>
        <a th:href="@{/reportes/nuevo}">Nuevo Reporte</a>
        <a th:href="@{/usuarios}">Usuarios</a>
    </div>
</nav>

<div class="container">

    <div class="page-header">
        <h1>➕ Nuevo Reporte</h1>
        <a th:href="@{/reportes}" class="btn btn-secondary">← Volver</a>
    </div>

    <div class="form-card">
        <h2>Registrar daño</h2>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/reportes}" method="post">

            <!-- Quien reporta -->
            <div class="form-group">
                <label for="creadorId">Reportado por</label>
                <select id="creadorId" name="creadorId" required>
                    <option value="">-- Selecciona un usuario --</option>
                    <option th:each="u : ${usuarios}"
                            th:value="${u.id}"
                            th:text="${u.nombre + ' (' + u.rol.name() + ')'}">
                        Usuario
                    </option>
                </select>
            </div>

            <!-- Categoria y prioridad -->
            <div class="form-row">
                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">-- Selecciona --</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.name()}"
                                th:text="${cat.name().replace('_', ' ')}">
                            cat
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="prioridad">Prioridad</label>
                    <select id="prioridad" name="prioridad" required>
                        <option value="">-- Selecciona --</option>
                        <option th:each="p : ${prioridades}"
                                th:value="${p.name()}"
                                th:text="${p.name()}">
                            p
                        </option>
                    </select>
                </div>
            </div>

            <!-- Ubicacion -->
            <div class="form-row">
                <div class="form-group">
                    <label for="edificio">Edificio</label>
                    <input type="text" id="edificio" name="edificio"
                           placeholder="Ej: Bloque A" required/>
                </div>
                <div class="form-group">
                    <label for="espacio">Espacio</label>
                    <input type="text" id="espacio" name="espacio"
                           placeholder="Ej: Laboratorio 3, Puesto 5" required/>
                </div>
            </div>

            <!-- Descripcion -->
            <div class="form-group">
                <label for="descripcion">Descripción del daño</label>
                <textarea id="descripcion" name="descripcion"
                          placeholder="Describe el daño con detalle..." required></textarea>
            </div>

            <div style="display:flex; gap:0.8rem; margin-top:0.5rem;">
                <button type="submit" class="btn btn-primary">Crear Reporte</button>
                <a th:href="@{/reportes}" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>
    </div>

</div>
</body>
</html>
