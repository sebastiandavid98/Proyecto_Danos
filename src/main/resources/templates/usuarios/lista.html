<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Usuarios | Reporte Daños</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">🔧 Reporte Daños</a>
    <div class="navbar-links">
        <a th:href="@{/reportes}">Reportes</a>
        <a th:href="@{/reportes/nuevo}">Nuevo Reporte</a>
        <a th:href="@{/usuarios}">Usuarios</a>
    </div>
</nav>

<div class="container">

    <div class="page-header">
        <h1>👥 Usuarios</h1>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">+ Nuevo Usuario</a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <div th:if="${#lists.isEmpty(usuarios)}" class="empty-state">
        <p>No hay usuarios registrados.</p>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">Crear el primero</a>
    </div>

    <table class="tabla" th:unless="${#lists.isEmpty(usuarios)}">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.nombre}">nombre</td>
                <td th:text="${u.email.valor}">email</td>
                <td th:text="${u.rol.name().replace('_', ' ')}">rol</td>
                <td>
                    <span th:if="${u.activo}"
                          class="badge badge-solucionado">Activo</span>
                    <span th:unless="${u.activo}"
                          class="badge badge-cerrado">Inactivo</span>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</body>
</html>
