<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nuevo Usuario | Reporte Daños</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">🔧 Reporte Daños</a>
    <div class="navbar-links">
        <a th:href="@{/reportes}">Reportes</a>
        <a th:href="@{/reportes/nuevo}">Nuevo Reporte</a>
        <a th:href="@{/usuarios}">Usuarios</a>
    </div>
</nav>

<div class="container">

    <div class="page-header">
        <h1>➕ Nuevo Usuario</h1>
        <a th:href="@{/usuarios}" class="btn btn-secondary">← Volver</a>
    </div>

    <div class="form-card">
        <h2>Registrar usuario</h2>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/usuarios}" method="post">

            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Ej: Juan Pérez" required/>
            </div>

            <div class="form-group">
                <label for="email">Email institucional</label>
                <input type="email" id="email" name="email"
                       placeholder="Ej: juan.perez@universidad.edu.co" required/>
            </div>

            <div class="form-group">
                <label for="rol">Rol</label>
                <select id="rol" name="rol" required>
                    <option value="">-- Selecciona un rol --</option>
                    <option th:each="r : ${roles}"
                            th:value="${r.name()}"
                            th:text="${r.name().replace('_', ' ')}">
                        rol
                    </option>
                </select>
            </div>

            <div style="display:flex; gap:0.8rem; margin-top:0.5rem;">
                <button type="submit" class="btn btn-primary">Crear Usuario</button>
                <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>
    </div>

</div>
</body>
</html>
